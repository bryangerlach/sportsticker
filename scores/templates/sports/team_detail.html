<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Full Details - Ticker</title>
    <style>
        /* Base fallback styles matching Plain Text Sports */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: monospace; 
            padding: 15px; 
            max-width: 500px; 
            margin: auto; 
            box-sizing: border-box;
            overflow-x: auto;
        }
        .back-nav { display: block; margin-bottom: 20px; color: #9090ff; text-decoration: none; }
        
        .plaintext-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Injected source styles */
        {{ styles|safe }}
    </style>
</head>
<body>
    <a class="back-nav" href="{% url 'scores:dashboard' %}">&lt; Back to Dashboard</a>
    
    <div class="plaintext-wrapper">
        {{ body_content|safe }}
    </div>
</body>
</html>
